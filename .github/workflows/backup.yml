# ============================================================
# Lummen Elite — Backup Automático do Firestore
# Executa toda segunda-feira às 3h da manhã (horário de Brasília)
# Salva backup como artifact do GitHub Actions
# ============================================================

name: Firestore Backup

on:
  schedule:
    # Toda segunda-feira às 06:00 UTC (03:00 BRT)
    - cron: "0 6 * * 1"
  
  # Permitir execução manual
  workflow_dispatch:

env:
  FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create service account key file
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > scripts/serviceAccountKey.json

      - name: Run Firestore backup
        id: backup
        run: |
          npx tsx scripts/backup-firestore.ts 2>&1 | tee backup-output.txt
          
          # Extract backup directory name
          BACKUP_DIR=$(grep "Diretório:" backup-output.txt | sed 's/.*scripts\/backups\///' | tr -d '\r')
          echo "backup_dir=$BACKUP_DIR" >> $GITHUB_OUTPUT
          
          # Extract total documents
          TOTAL=$(grep "documentos exportados" backup-output.txt | grep -o '[0-9]*')
          echo "total_docs=$TOTAL" >> $GITHUB_OUTPUT

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ steps.backup.outputs.backup_dir }}
          path: scripts/backups/${{ steps.backup.outputs.backup_dir }}/
          retention-days: 90

      - name: Summary
        run: |
          echo "## 🔄 Firestore Backup Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Documentos:** ${{ steps.backup.outputs.total_docs }}" >> $GITHUB_STEP_SUMMARY
          echo "**Diretório:** ${{ steps.backup.outputs.backup_dir }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O backup está disponível como artifact com 90 dias de retenção." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup service account key
        if: always()
        run: rm -f scripts/serviceAccountKey.json

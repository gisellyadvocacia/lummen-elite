# ============================================================
# Lummen Elite — Deploy Automático via GitHub Actions + Vercel
# ============================================================
# Executa a cada push no branch master
# Deploy preview em PRs, deploy production no master
#
# REQUER secrets no GitHub repo:
#   VERCEL_TOKEN      → Token de acesso Vercel
#   VERCEL_ORG_ID     → ID da organização/account Vercel
#   VERCEL_PROJECT_ID → ID do projeto Vercel
# ============================================================

name: Deploy to Vercel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production on push, preview on PR)
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "🚀 Deploying to PRODUCTION..."
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            echo "🔍 Deploying PREVIEW..."
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## 🚀 Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
